name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        #
        # Kept as its own step even though `cyrius audit` below re-runs it:
        # a test failure should read as "Test", not as "Audit". The extra
        # run costs seconds.
        run: cyrius test

      # ORDER MATTERS: this runs BEFORE the audit, not after. tests/prani.bcyr
      # benchmarks `dist/prani.cyr` — the generated bundle, deliberately, since
      # that is what a consumer gets. So a stale bundle makes the audit's bench
      # stage measure the LAST BUNDLED code rather than this commit's, and
      # report it as green. That happened in 2.0.10: the bench read 155 ns from
      # a stale dist/ while the actual fix measured 114 ns. Fail on staleness
      # first, then measure.
      - name: Bundle coherence — dist/ matches src/
        # dist/prani.cyr and dist/prani.deps are TRACKED build products,
        # regenerated from [lib].modules. A PR that edits src/ without
        # re-running `cyrius distlib` ships a bundle that disagrees with the
        # source — and consumers (kiran, joshua) build against the bundle,
        # not against src/. `cyrius distlib` is deterministic, so any diff
        # here is a stale commit, not run-to-run noise.
        run: |
          cyrius distlib
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is stale — run 'cyrius distlib' and commit the result."
            exit 1
          fi

      - name: Audit — fmt · lint · docs · tests · bench
        # THE gate. CONTRIBUTING.md names this as the single command a PR
        # must pass, and until 2.0.4 it ran only on contributors' machines —
        # so fmt, lint, docs and bench were never actually enforced anywhere.
        #
        # Note the fmt stage here is STRICTER than `cyrius fmt <file> --check`:
        # the per-file check accepts 4-space continuation indents, this
        # requires the canonical 2 spaces per open paren (cyrfmt became
        # paren-aware in 6.5.28). Trust this one.
        run: cyrius audit

      - name: Benchmark baseline — report timing deltas
        # 2.0.11. `cyrius audit`'s bench stage reports "1 passed, 0 failed"
        # because all it checks is that the harness RAN — it compares nothing.
        # This prints a delta per benchmark against benches/baseline.csv.
        #
        # REPORT-ONLY on purpose: wall-clock on a shared runner is noisy (a 20%
        # swing on an unchanged tree is ordinary) and a gate that cries wolf gets
        # disabled, which is worse than no gate. The DETERMINISTIC half —
        # allocation — is hard-gated in tests/allocbudget.tcyr, which the audit
        # above already runs. Set BENCH_GATE=<factor> here only once recorded
        # history shows this runner is quiet enough to justify it.
        #
        # It still fails if a baseline benchmark stops running: a benchmark
        # disappearing is a real regression, not noise.
        run: sh scripts/bench-check.sh

      - name: Examples — build and run all five
        # Roadmap 2.0.6's gate. `rust-old/` (the frozen Rust oracle) was removed
        # in 2.0.8, after which a worked example is the only executable
        # statement of how this API is driven — so they must not be left to rot.
        # Each one includes dist/prani.cyr exactly as a consumer would, so this
        # also proves the published bundle is usable from outside the library.
        run: sh scripts/run-examples.sh
